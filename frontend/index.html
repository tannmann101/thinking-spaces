<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Thinking Spaces</title>

    <!-- Installable to a phone's home screen, so capturing a thought is
         a tap from the lock screen rather than a browser, a bookmark and
         a wait. display:standalone drops the browser chrome, which on a
         small screen is most of what was between you and the page.

         iOS ignores the manifest's own icons for the home screen and
         reads apple-touch-icon instead, so both are declared. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Thinking" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The other half of public/404.html's redirect trick: if we got
      // here via that redirect, ?redirect=<encoded path> carries the
      // real path the user actually meant to load. Swap it back into
      // the address bar via replaceState *before* React Router mounts,
      // so it sees the real route on first render instead of "/" --
      // this runs as a plain classic script (not type="module") so it
      // executes before the module script below.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
