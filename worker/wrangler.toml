name = "thinking-spaces-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Intercepts /api/* at the Cloudflare edge for thinking.thegardners.xyz
# -- the rest of that subdomain is served by GitHub Pages (the built
# frontend), same split gardners-hub's own Worker already uses for the
# main site.
routes = [
  { pattern = "thinking.thegardners.xyz/api/*", zone_name = "thegardners.xyz" }
]

[[d1_databases]]
binding = "DB"
database_name = "thinking-spaces"
database_id = "a2250941-5880-4048-816b-25deeaaf83f4"
