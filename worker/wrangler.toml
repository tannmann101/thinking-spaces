name = "thinking-spaces-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Intercepts /api/* at the Cloudflare edge for thinking.thegardners.xyz
# -- the rest of that subdomain is served by GitHub Pages (the built
# frontend), same split gardners-hub's own Worker already uses for the
# main site.
routes = [
  { pattern = "thinking.thegardners.xyz/api/*", zone_name = "thegardners.xyz" }
]

[[d1_databases]]
binding = "DB"
database_name = "thinking-spaces"
database_id = "a2250941-5880-4048-816b-25deeaaf83f4"

# Object storage for uploaded files (the "document" half of content
# ingestion). A Worker has no filesystem, so where backend/ writes to
# backend/data/uploads/, the deployed side puts objects here instead --
# see worker/src/index.js's /uploads routes. The bucket has to be
# created once by hand before the first deploy that uses it; DEPLOY.md
# has the command.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "thinking-spaces-uploads"
